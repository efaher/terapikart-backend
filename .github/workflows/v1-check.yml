name: Persona Card Backend Checks

on:
  push:
    branches: [v1.2-annual-license-pwa]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check backend syntax
        run: npm run check
      - name: Test annual license behavior
        run: npm test
      - name: Validate Render Blueprint YAML
        run: ruby -e "require 'yaml'; YAML.load_file('render.yaml'); puts 'render.yaml ok'"
